<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1022" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Glowing Aura Circle -->
  <circle cx="400" cy="210" r="130" fill="#f43f5e" opacity="0.12" filter="url(#glow)" />
  <circle cx="400" cy="210" r="80" fill="#3b82f6" opacity="0.1" filter="url(#glow)" />

  <!-- Center Icon Graphic -->
  <text x="400" y="240" font-size="100" text-anchor="middle" dominant-baseline="middle">🏁</text>

  <!-- Badge Top -->
  <rect x="30" y="30" width="170" height="30" rx="15" fill="rgba(6,9,19,0.8)" stroke="#f43f5e" stroke-width="1.5" />
  <text x="115" y="50" fill="#f43f5e" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle" letter-spacing="1.5">2P DRAG RACE</text>

  <!-- Badge Top Right -->
  <rect x="630" y="30" width="140" height="30" rx="15" fill="rgba(6,9,19,0.8)" stroke="#3b82f6" stroke-width="1.5" />
  <text x="700" y="50" fill="#3b82f6" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle" letter-spacing="1">1V1 LOCAL</text>

  <!-- Title Bottom -->
  <rect x="0" y="350" width="800" height="130" fill="rgba(4,7,16,0.85)" />
  <line x1="0" y1="350" x2="800" y2="350" stroke="url(#accentGrad)" stroke-width="2" />

  <text x="40" y="405" fill="#ffffff" font-family="'Orbitron', sans-serif, system-ui" font-weight="900" font-size="34" letter-spacing="3">NITRO SPEED</text>
  <text x="40" y="440" fill="#f43f5e" font-family="sans-serif" font-weight="700" font-size="14" letter-spacing="4">TOKYO DRAG 1V1</text>

  <!-- Controls hint -->
  <text x="760" y="425" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="end">WASD vs ARROWS</text>
</svg>